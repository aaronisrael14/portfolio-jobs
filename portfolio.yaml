# Portfolio companies shown on the job board.
#
# careers.type tells the nightly fetcher where each company's jobs live:
#   greenhouse | lever | ashby | workable  -> slug
#   comeet                                  -> slug + uid  (from comeet.com/jobs/<slug>/<uid>)
#   hibob                                   -> slug        (from <slug>.careers.hibob.com)
#   html                                    -> url + link  (regex for job links on the company's own careers page)
#                                              or url + item (CSS selector for each job card) for pages without per-job links
#                                              optional: title / location / department CSS selectors inside a card
#   none                                    -> no public jobs; company still shows in the roster
#
# Run `python scripts/detect_careers.py` after adding a company to get a suggested careers block.
# Detected on 2026-10-28.

