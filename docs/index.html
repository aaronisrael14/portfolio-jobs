<style>
/* Palette taken from secretchord.vc */
:root {
  --bg: #2B2B2B;
  --card: #313131;
  --card-hover: #363636;
  --ink: #ECECEC;
  --body: #959595;
  --label: #828282;
  --faint: #787878;
  --line: #484848;
  --font: "Figtree", "Proxima Nova", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 32px clamp(16px, 3vw, 34px) 48px; }
@media (min-width: 900px) { .wrap { width: 67vw; max-width: 1180px; padding-left: 0; padding-right: 0; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Header */
.head { display: flex; align-items: center; gap: 18px; }
.logo { width: 64px; height: 64px; border-radius: 16px; border: 1px solid var(--line); flex: none; display: block; }
.kicker { font: 400 12.5px/1 var(--font); letter-spacing: 0.26em; text-transform: uppercase; color: var(--label); margin: 0 0 10px; }
h1 { font: 700 clamp(32px, 4.4vw, 48px)/1.05 var(--font); letter-spacing: -0.02em; margin: 0; color: var(--ink); }
.intro { font: 300 clamp(16px, 1.5vw, 18px)/1.6 var(--font); color: var(--body); margin: 26px 0 0; max-width: 88ch; }

/* Filters */
.filters { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.45fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.1fr); gap: 10px; margin-top: 30px; }
.field { position: relative; }
.filters input, .filters select {
  width: 100%; height: 48px; font: 400 15.5px var(--font); color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 12px; padding: 0 16px; appearance: none; -webkit-appearance: none;
}
.filters input::placeholder { color: var(--faint); }
.filters input:focus, .filters select:focus { outline: none; border-color: var(--body); }
.filters select { padding-right: 36px; cursor: pointer; text-overflow: ellipsis; }
.filters select option { background: #2B2B2B; color: #ECECEC; }
.field.sel::after { content: ""; position: absolute; right: 17px; top: 19px; width: 6px; height: 6px; border: solid var(--body);
  border-width: 0 1px 1px 0; transform: rotate(45deg); pointer-events: none; }
.meta-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 26px 0 12px; }
.count { color: var(--body); font-size: 15px; margin: 0; }
.clear { background: none; border: 0; padding: 0; font: inherit; font-size: 14px; color: var(--ink); cursor: pointer;
  text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 4px; }

/* Job cards */
.jobs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.job a { display: flex; align-items: center; gap: 20px; padding: 20px 24px; background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; text-decoration: none; }
.job a:hover { background: var(--card-hover); border-color: #5A5A5A; }
.job .text { flex: 1; min-width: 0; }
.title { font: 700 18px/1.35 var(--font); margin: 0; color: var(--ink); }
.sub { font-size: 15px; color: var(--body); margin-top: 4px; }
.sub .dot { margin: 0 6px; color: var(--faint); }
.tag { display: inline-block; font: 500 10.5px/1 var(--font); letter-spacing: 0.16em; text-transform: uppercase; padding: 4px 7px;
  border: 1px solid var(--line); border-radius: 6px; color: var(--body); margin-left: 10px; vertical-align: 3px; }
.tag.new { border-color: var(--ink); color: var(--ink); }
.apply { flex: none; font: 500 15.5px/1 var(--font); color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.apply svg { transition: transform .15s ease; }
.job a:hover .apply svg { transform: translateX(2px); }

.empty { padding: 40px 24px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; color: var(--body); }
.empty strong { color: var(--ink); font-weight: 500; display: block; margin-bottom: 4px; }
.more { display: block; margin: 22px auto 0; background: none; border: 1px solid var(--line); color: var(--ink); cursor: pointer;
  font: 500 14px/1 var(--font); padding: 14px 24px; border-radius: 12px; }
.more:hover { border-color: var(--body); }

footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--label);
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }

@media (max-width: 1260px) {
  .filters { grid-template-columns: minmax(0, 1.3fr) repeat(3, minmax(0, 1fr)); }
  .filters .search { grid-column: 1 / -1; }
}
@media (max-width: 900px) {
  .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .wrap { padding-top: 22px; }
  .logo { width: 52px; height: 52px; border-radius: 13px; }
  .kicker { font-size: 11px; margin-bottom: 7px; }
  .filters .field:nth-child(2), .filters .field:nth-child(5) { grid-column: 1 / -1; }
  .job a { padding: 16px 16px; gap: 12px; align-items: flex-start; }
  .apply { font-size: 14.5px; margin-top: 2px; }
  .title { font-size: 16.5px; }
  .tag { margin-left: 0; margin-top: 6px; vertical-align: 0; }
}
@media (prefers-reduced-motion: reduce) { .apply svg { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <img class="logo" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACABAMAAAAxEHz4AAAAGFBMVEX6+vjW1tVAQEAoKCgnKCknKCgmKCgeHx+of64aAAADjUlEQVR42u2XQW8bRRTHfzMJrYJQPC41SJWTrBdyalWKiDgQEqXCHJCaNq4g4kAPiE/AF4EPUCTENZHaSviEnCZKFSRQm6KQUyLWW7sSEWmz41zqgzvDYR3Xu/EGpB7gMHvamXnzm3n/ffPerPiMl3skDuAADuAADuAADuAADuAADvDfAIJ/GB8eZO8ftUwo33v+m/TiEb9n42cCgjLAk8Pu/GbZrgyXO2s+iDJ3vbi33L8tkfjhMG8vR5AvmNi08eEtDaJwbdUzapVKI+7d5+xEb8rQ+X5A89d6u92Oni20AIKZ7/9st9vPDvY+0eL05l5HK8CMb+593hosopmuAxDFranb8YsN7sC2ynVn5bTIEvHxA0ReRTaWoBnUEXlFFNk/rjZAnx6NeeT1YIA5/wuTFViWAOadZcRkBViKhjRjH3zbuXgINDcZ3vIG70Ah52vwca4O8JrmjfkasLh0asuzgkgdAsKislywnF3z4b70Yn/kF+s+UFt82oqHAdAiN5EZiUICvgeYC5rCmgfg11ogNxTVEMy0ZiY7lDsXe685La52R+PAU/ZolRPOQtRzT0aIUa/fvzw6lqCwngUQmOpRlDZWeb3RPzg2x/4sNG8nNEwA5IZit/wizmWY1OdfHOc85uYRQSdXQraUBSa0uOJlAYoVxcHNj8LBJ38bWw1NUYvsHciNEhx8N5tBUGiwKJ3tQvH9EkTV8YHzxy/TuTS0xitb2QB5f7GE3Xlr4BZMnmj0UZSWJmnk1xZL2B/iDR9/LGiROzGp+rXriv3Z7ndImm4o7l2AGe/ErOzf+xLbACuwXlpF28qlPsKAtD72s7JbIWMLPDkuprap+BwAkF3vBZakmMUKnTvp+EzmxDDhsa2aZHERRDYtbgLwOBFCit258EWxAFrKpgI5CTDT1dkgCC7F6hevY6pzQRCE5aVHse02Nq1hKqXt/FiBn7S40gC54YU7tz6FzlL9VBgvq/QxyforU+OvusgrG2n5dQMwE9900zqFudh49yFvjnsnFVd7cABMrnvx0arHbczoIcDzuYfHAlQmPlMegDNdnYqLJQUgzny11cspuRSgvzaK3xf2xMjIuRtr3Uh4MF9nZOTVczdWSnGHbstrIlsDTPOyuTular3yH0wpwK70OvyjGp9V3kP57tPQT99P/L62z0kAIPBf8o7ku3uiAziAAziAAziAAziAAzjA/wPwNzQ+RBaUvLnDAAAAAElFTkSuQmCC" alt="Secret Chord Ventures" width="64" height="64">
    <div>
      <p class="kicker" id="kicker">Secret Chord Ventures</p>
      <h1>Portfolio Jobs</h1>
    </div>
  </header>
  <p class="intro" id="intro">Open roles across the Secret Chord Ventures portfolio. Applications go directly to each company.</p>

  <div class="filters" role="search">
    <div class="field search">
      <label class="sr" for="fQ">Search roles</label>
      <input id="fQ" type="search" placeholder="Search roles…" autocomplete="off">
    </div>
    <div class="field sel"><label class="sr" for="fCo">Company</label><select id="fCo"><option value="">All companies</option></select></div>
    <div class="field sel"><label class="sr" for="fSector">Sector</label><select id="fSector"><option value="">All sectors</option></select></div>
    <div class="field sel"><label class="sr" for="fTeam">Team</label><select id="fTeam"><option value="">All teams</option></select></div>
    <div class="field sel"><label class="sr" for="fPlace">Location</label><select id="fPlace"><option value="">All locations</option></select></div>
  </div>

  <div class="meta-row">
    <p class="count" id="count" aria-live="polite">Loading open positions…</p>
    <button class="clear" id="clear" hidden>Clear filters</button>
  </div>

  <ul class="jobs" id="jobs" aria-label="Open positions"></ul>
  <button class="more" id="more" hidden>Show all positions</button>

  <footer>
    <span id="updated"></span>
    <span>Roles are pulled nightly from each company's careers page.</span>
  </footer>
</div>

<script>
/* ---- Settings: edit these ---------------------------------------------- */
const CONFIG = {
  fundName: "Secret Chord Ventures",   // shown above the title and in the intro line
  pageSize: 50,                        // positions shown before "Show all positions"
};
/* ------------------------------------------------------------------------ */

const $ = (s) => document.querySelector(s);
const els = { q: $("#fQ"), co: $("#fCo"), sector: $("#fSector"), team: $("#fTeam"), place: $("#fPlace") };
const SELECTS = ["co", "sector", "team", "place"];
const HASH_KEYS = { q: "q", co: "company", sector: "sector", team: "team", place: "location" };
let DATA = null, CO = {}, showAll = false;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const plural = (n, w) => `${n} ${n === 1 ? w : w + "s"}`;
const ARROW = `<svg width="9" height="14" viewBox="0 0 9 14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m1.5 1.5 5.5 5.5-5.5 5.5"/></svg>`;

function isNew(j) {
  if (!j.first_seen || j.first_seen <= DATA.baseline) return false;
  return (Date.parse(DATA.updated_at) - Date.parse(j.first_seen)) / 864e5 <= 7;
}

function matches(j) {
  if (els.co.value && j.company !== els.co.value) return false;
  if (els.sector.value && (CO[j.company] || {}).sector !== els.sector.value) return false;
  if (els.team.value && j.function !== els.team.value) return false;
  const p = els.place.value;
  if (p === "Remote" ? !j.remote : p && j.region !== p) return false;
  const q = els.q.value.trim().toLowerCase();
  if (q && !`${j.title} ${j.company} ${j.location} ${j.department} ${j.function}`.toLowerCase().includes(q)) return false;
  return true;
}

function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  for (const k in HASH_KEYS) els[k].value = p.get(HASH_KEYS[k]) || "";
  for (const k of SELECTS) if (els[k].selectedIndex < 0) els[k].value = "";
}
function writeHash() {
  const p = new URLSearchParams();
  for (const k in HASH_KEYS) { const v = els[k].value.trim(); if (v) p.set(HASH_KEYS[k], v); }
  const h = p.toString();
  history.replaceState(null, "", h ? "#" + h : location.pathname + location.search);
}

function fill(select, values, label) {
  const keep = select.value;
  select.length = 1;
  for (const v of values) { const o = new Option(label ? label(v) : v, v); select.add(o); }
  select.value = keep;
}

function render() {
  const list = DATA.jobs.filter(matches);
  const shown = showAll ? list : list.slice(0, CONFIG.pageSize);
  const filtered = Object.keys(HASH_KEYS).some((k) => els[k].value.trim());

  $("#count").textContent = `${plural(list.length, "open position")}`;
  $("#clear").hidden = !filtered;

  $("#jobs").innerHTML = shown.length ? shown.map((j) => {
    const bits = [esc(j.company), esc(j.location || "Location on posting")];
    if (j.remote && !/remote/i.test(j.location)) bits.push("Remote");
    return `<li class="job"><a href="${esc(j.url)}" target="_blank" rel="noopener">
      <div class="text">
        <p class="title">${esc(j.title)}${isNew(j) ? `<span class="tag new">New</span>` : ""}</p>
        <div class="sub">${bits.join('<span class="dot">·</span>')}</div>
      </div>
      <span class="apply">Apply ${ARROW}</span>
    </a></li>`;
  }).join("") : `<li class="empty"><strong>No positions match those filters.</strong>Try a different company, team or location.</li>`;

  const more = $("#more");
  more.hidden = showAll || list.length <= CONFIG.pageSize;
  more.textContent = `Show all ${list.length} positions`;
}

function update() { showAll = false; writeHash(); render(); }

function init(data) {
  DATA = data;
  CO = Object.fromEntries(data.companies.map((c) => [c.name, c]));
  // Group by company, then title, like a directory.
  data.jobs.sort((a, b) => a.company.localeCompare(b.company) || a.title.localeCompare(b.title));

  const uniq = (arr) => [...new Set(arr.filter(Boolean))];
  const hiring = uniq(data.jobs.map((j) => j.company)).sort((a, b) => a.localeCompare(b));
  fill(els.co, hiring);
  els.co.options[0].text = `All companies (${hiring.length})`;
  fill(els.sector, uniq(hiring.map((n) => (CO[n] || {}).sector)).sort());
  const teamCount = data.jobs.reduce((m, j) => (m[j.function] = (m[j.function] || 0) + 1, m), {});
  fill(els.team, Object.keys(teamCount).sort((a, b) => teamCount[b] - teamCount[a]));
  const regions = ["Israel", "United States", "Europe", "Asia-Pacific"].filter((r) => data.jobs.some((j) => j.region === r));
  if (data.jobs.some((j) => j.remote)) regions.push("Remote");
  fill(els.place, regions);

  $("#updated").textContent = "Updated " + new Date(data.updated_at).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
  readHash(); render();
}

// Settings
document.title = `${CONFIG.fundName} | Portfolio Jobs`;
$("#kicker").textContent = CONFIG.fundName;
$("#intro").textContent = `Open roles across the ${CONFIG.fundName} portfolio. Applications go directly to each company.`;

for (const k of SELECTS) els[k].addEventListener("change", update);
let t; els.q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(update, 120); });
$("#clear").onclick = () => { for (const k in HASH_KEYS) els[k].value = ""; update(); };
$("#more").onclick = () => { showAll = true; render(); };
window.addEventListener("hashchange", () => { readHash(); render(); });

// When embedded in another site (e.g. a Base44 page), tell the parent page how tall the board is,
// so the iframe can grow to fit instead of scrolling inside itself.
if (window.parent !== window && "ResizeObserver" in window) {
  new ResizeObserver(() => window.parent.postMessage(
    { type: "portfolio-jobs-height", height: document.documentElement.scrollHeight }, "*"
  )).observe(document.body);
}

(window.__JOBS__ ? Promise.resolve(window.__JOBS__) : fetch("jobs.json", { cache: "no-cache" }).then((r) => {
  if (!r.ok) throw new Error(r.status);
  return r.json();
})).then(init).catch(() => {
  $("#count").textContent = "Open positions couldn't load.";
  $("#jobs").innerHTML = `<li class="empty"><strong>jobs.json didn't load.</strong>Open this page from the published site, not as a local file.</li>`;
});
</script>
</body>
