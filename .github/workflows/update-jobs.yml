name: Update jobs

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths: [portfolio.yaml, scripts/**]

permissions:
  contents: write

# One run at a time: a run that starts while another is going waits its turn.
concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_jobs.py
      - name: Save the new jobs list
        run: |
          git config user.name "jobs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/jobs.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Update jobs $(date -u +%F)"
          # If someone saved a change while this run was working, catch up and try again.
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
